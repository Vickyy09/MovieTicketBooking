spring.application.name=Booking


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_ticket_booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=movie-ticket-booking
barcode.url=${BARCODE_URL:https://quickchart.io/barcode}
barcode.connect-timeout=2s
barcode.read-timeout=3s
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
demo.admin-password=${DEMO_ADMIN_PASSWORD:}
